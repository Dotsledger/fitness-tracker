# Evita que Supabase (plan free) pause el proyecto por inactividad (~7 días).
# Hace una consulta mínima cada 3 días. La anon key es pública por diseño
# (ya está en js/config.js), así que puede ir aquí sin riesgo añadido.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 */3 * *" # cada 3 días a las 06:00 UTC
  workflow_dispatch: {} # y lanzable a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVucGlsbHh6eGt5b2FoaWV0enJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Mzc4OTAsImV4cCI6MjA5OTUxMzg5MH0.W_IR5ILddQWCGn96Vu50AqyYYc6gzRZjgl01SgRaWAE
        run: |
          curl -sf "https://unpillxzxkyoahietzrj.supabase.co/rest/v1/profile?select=id&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" > /dev/null
          echo "Supabase activo ✅"
